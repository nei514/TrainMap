<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鉄道運行情報 / 台風情報オーバーレイ</title>
<style>
:root{
  --u:1;

  /* ---- 基本パレット ---- */
  --bg:#171717;        /* 地                                 */
  --band:#242424;      /* ヘッダ／地図の台座                 */
  --fg:#f2f2f2;        /* 文字（純白は眩しいので少し落とす） */
  --line:#3e3e3e;      /* 罫線・境界                         */
  --dim:#525252;       /* 発表なしの区域                     */

  --panel:var(--band);
  --sub:#9a9a9a;

  --danger:#ff5a54;
  --warn:#ffc93c;
  --ok:#4fd18b;
  --info:#5aa9ff;
  --typhoon:#ff6b63;
  --gale:#ffd24d;

  /* ---- 地図エリア（ダーク＝既定） ---- */
  --map-bg:var(--bg);        /* 海         */
  --map-land:var(--band);    /* 陸（台座） */
  --map-coast:var(--line);   /* 海岸線     */
  --map-rail:var(--dim);     /* 通常の路線 */
  --map-node:var(--band);    /* 駅マーク（線を切る色） */
  --map-label:var(--fg);
  --map-labelbg:rgba(36,36,36,.94);
  --map-labelbd:var(--line);
  --map-cont:var(--line);    /* 大陸 */
  --map-contfill:#1e1e1e;
  --map-track:rgba(242,242,242,.8);  /* 台風の進路・予報円 */
  --map-base:#343434;                /* 全国の幹線ネットワーク */
}
/* 地図エリアだけ白地の路線図風にするとき */
html:not(.map-dark){
  --map-bg:#dfe4ea;
  --map-land:#ffffff;
  --map-coast:#9fabb8;
  --map-rail:#c4cad1;
  --map-node:#ffffff;
  --map-label:#15181c;
  --map-labelbg:rgba(255,255,255,.94);
  --map-labelbd:rgba(0,0,0,.20);
  --map-cont:#b9c3cf;
  --map-contfill:#f4f6f8;
  --map-track:#3a4149;
  --map-base:#aab4bf;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  color:var(--fg);-webkit-font-smoothing:antialiased}

#stage{position:absolute;inset:0;display:flex;flex-direction:row}
#stage.portrait{flex-direction:column}
#mapWrap{position:relative;flex:1 1 auto;min-width:0;min-height:0;order:2}
#map{display:block;width:100%;height:100%}
#panel{position:relative;flex:0 0 auto;order:1;background:var(--panel);
  display:flex;flex-direction:column;
  padding:calc(30px*var(--u)) calc(24px*var(--u)) calc(24px*var(--u))
          calc(12px*var(--u) + var(--barw))}
:root{--barw:calc(22px*var(--u))}
#panel.nobar{padding-left:calc(24px*var(--u))}
#edgeBar.hide{display:none}
#edgeBar{position:absolute;left:0;top:0;bottom:0;width:var(--barw);
  background:var(--ok);display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  padding-bottom:calc(34px*var(--u));gap:calc(3px*var(--u));
  transition:background .3s ease}
#edgeBar .n{font-size:calc(24px*var(--u));font-weight:700;line-height:1.05;
  color:var(--bar-fg,#fff)}
#edgeBar .sep{width:calc(12px*var(--u));height:calc(2px*var(--u));
  background:var(--bar-fg,#fff);opacity:.7;margin:calc(2px*var(--u)) 0}

.p-title{font-size:calc(56px*var(--u));font-weight:600;letter-spacing:.04em;line-height:1.1}
.p-rule{height:calc(5px*var(--u));background:var(--fg);margin:calc(14px*var(--u)) 0 calc(24px*var(--u))}

.card{opacity:1;transition:opacity .3s ease}
.card.out{opacity:0}
.card.hide{display:none}

/* ---- 鉄道 ---- */
.line-row{display:flex;align-items:center;gap:calc(16px*var(--u))}
.badge{flex:none;width:calc(86px*var(--u));height:calc(86px*var(--u));
  border-radius:calc(14px*var(--u));display:flex;align-items:center;justify-content:center;
  font-size:calc(44px*var(--u));font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.badge.empty{display:none}
.badge.icon{background:transparent!important;border-radius:0;padding:0}
.badge.icon.plate{background:#fff!important;border-radius:calc(12px*var(--u));
  padding:calc(5px*var(--u))}
.badge img{width:100%;height:100%;object-fit:contain;display:block}
.line-name{font-size:calc(86px*var(--u));font-weight:500;line-height:1;white-space:nowrap}
.line-sub{margin-top:calc(10px*var(--u));text-align:right;
  font-size:calc(30px*var(--u));color:var(--sub);min-height:calc(34px*var(--u))}
.status-row{margin-top:calc(26px*var(--u));display:flex;align-items:center;gap:calc(14px*var(--u))}
.mark{font-size:calc(52px*var(--u));line-height:1;font-weight:700}
.mark.icon{display:flex;align-items:center;justify-content:center}
.mark.icon img{height:calc(58px*var(--u));width:auto;display:block}
.status{font-size:calc(60px*var(--u));font-weight:500;line-height:1.05;white-space:nowrap}
.st-danger .mark{color:var(--danger)}
.st-warn   .mark{color:var(--warn)}
.st-ok     .mark{color:var(--ok)}
.st-info   .mark{color:var(--info)}
.resume{margin-top:calc(12px*var(--u));text-align:right;
  font-size:calc(40px*var(--u));min-height:calc(44px*var(--u))}
.resume.hide{visibility:hidden}
.c-rule{height:calc(2px*var(--u));background:var(--line);
  margin:calc(20px*var(--u)) 0 calc(16px*var(--u))}
.cause-label{font-size:calc(36px*var(--u));margin-bottom:calc(8px*var(--u))}
.cause-text{font-size:calc(38px*var(--u));line-height:1.45;color:var(--fg);
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:7}

/* ---- 台風 ---- */
.ty-no{font-size:calc(76px*var(--u));font-weight:600;line-height:1;white-space:nowrap}
.ty-name{margin-top:calc(6px*var(--u));font-size:calc(38px*var(--u));color:var(--sub)}
.ty-grade{margin-top:calc(18px*var(--u));font-size:calc(46px*var(--u));
  font-weight:600;color:var(--typhoon);line-height:1.15}
.ty-loc{margin-top:calc(10px*var(--u));font-size:calc(32px*var(--u));color:var(--sub)}
.ty-tbl{margin-top:calc(18px*var(--u));width:100%;border-collapse:collapse}
#cardTyphoon,#cardWx{min-height:0;overflow:hidden}
.ty-tbl td{padding:calc(6px*var(--u)) 0;vertical-align:baseline;
  border-bottom:1px solid var(--line)}
.ty-tbl td.k{font-size:calc(26px*var(--u));color:var(--sub);white-space:nowrap;width:40%}
.ty-tbl td.v{font-size:calc(34px*var(--u));text-align:right;font-weight:500}

.wx-when{font-size:calc(64px*var(--u));font-weight:600;line-height:1.05}
.wx-date{margin-top:calc(6px*var(--u));font-size:calc(30px*var(--u));color:var(--sub)}
.wx-elem{margin-top:calc(20px*var(--u));font-size:calc(38px*var(--u));font-weight:600}
.wx-legend{margin-top:calc(22px*var(--u));display:flex;flex-direction:column;
  gap:calc(10px*var(--u))}
.wx-legend .row{display:flex;align-items:center;gap:calc(12px*var(--u));
  font-size:calc(30px*var(--u))}
.wx-legend .sw{flex:none;width:calc(46px*var(--u));height:calc(26px*var(--u));
  border-radius:calc(4px*var(--u));border:1px solid var(--line)}

.footer{margin-top:auto;padding-top:calc(14px*var(--u));
  font-size:calc(20px*var(--u));color:var(--dim);
  display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.dots{display:flex;gap:calc(7px*var(--u));margin-top:calc(8px*var(--u))}
.dot{width:calc(9px*var(--u));height:calc(9px*var(--u));border-radius:50%;
  background:var(--dim)}
.dot.on{background:var(--fg)}
.dot.ty{border-radius:2px}

/* ---- 起動時のトークン入力 ---- */
#login{position:absolute;inset:0;z-index:50;background:rgba(23,23,23,.97);
  display:flex;align-items:center;justify-content:center;padding:24px}
#login.hide{display:none}
.lg-box{width:min(560px,92vw);background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:32px 30px}
.lg-ttl{font-size:30px;font-weight:600;letter-spacing:.03em}
.lg-rule{height:3px;background:var(--fg);margin:12px 0 18px}
.lg-desc{font-size:14px;line-height:1.6;color:var(--sub);margin-bottom:20px}
.lg-desc a{color:var(--fg)}
.lg-box label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
.lg-box input[type=password],.lg-box input[type=text]{width:100%;
  background:#1c1c1c;border:1px solid var(--line);
  border-radius:8px;color:var(--fg);font-size:15px;padding:11px 12px;outline:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lg-box input:focus{border-color:var(--sub)}
.lg-chk{display:flex!important;align-items:center;gap:8px;margin-top:16px!important;
  font-size:13px;color:var(--sub);cursor:pointer}
.lg-chk input{accent-color:var(--sub)}
.lg-btns{display:flex;gap:12px;margin-top:24px}
.lg-btns button{flex:1;padding:13px 0;border:none;border-radius:8px;cursor:pointer;
  font-size:16px;font-weight:600;font-family:inherit;background:var(--fg);color:#171717}
.lg-btns button.ghost{background:transparent;color:var(--sub);
  border:1px solid var(--line)}
.lg-note{margin-top:16px;font-size:12px;line-height:1.6;color:var(--dim)}
.lg-note b{color:var(--warn);font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div id="panel">
    <div id="edgeBar"><div class="n" id="barCur">1</div><div class="sep"></div><div class="n" id="barTot">1</div></div>
    <div class="p-title" id="pTitle">鉄道運行情報</div>
    <div class="p-rule"></div>

    <!-- 鉄道カード -->
    <div class="card" id="cardTrain">
      <div class="line-row">
        <div class="badge" id="badge">JY</div>
        <div class="line-name" id="lineName">―</div>
      </div>
      <div class="line-sub" id="lineSub"></div>
      <div class="status-row" id="statusRow">
        <div class="mark" id="mark"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="resume" id="resume"></div>
      <div class="c-rule"></div>
      <div class="cause-label">原因</div>
      <div class="cause-text" id="causeText"></div>
    </div>

    <!-- 台風カード -->
    <div class="card hide" id="cardTyphoon">
      <div class="ty-no"   id="tyNo">台風―号</div>
      <div class="ty-name" id="tyName"></div>
      <div class="ty-grade" id="tyGrade"></div>
      <div class="ty-loc"  id="tyLoc"></div>
      <table class="ty-tbl"><tbody id="tyBody"></tbody></table>
    </div>

    <!-- 天気分布予報カード -->
    <div class="card hide" id="cardWx">
      <div class="wx-when" id="wxWhen">―</div>
      <div class="wx-date" id="wxDate"></div>
      <div class="wx-elem" id="wxElem">天気</div>
      <div class="c-rule"></div>
      <div class="wx-legend" id="wxLegend"></div>
    </div>

    <div class="footer">
      <div><div id="src">ODPT</div><div class="dots" id="dots"></div></div>
      <div id="stamp"></div>
    </div>
  </div>
  <div id="mapWrap"><canvas id="map"></canvas></div>
</div>

<div id="login" class="hide">
  <div class="lg-box">
    <div class="lg-ttl">アクセストークン</div>
    <div class="lg-rule"></div>
    <div class="lg-desc">
      公共交通オープンデータセンターで取得したトークンを入力してください。
      どちらか片方だけでも動作します。空欄のままデモを見ることもできます。
    </div>

    <label>通常トークン ― 東京メトロ・都営（api.odpt.org）</label>
    <input id="lgKey" type="password" placeholder="acl:consumerKey" autocomplete="off" spellcheck="false">

    <label>チャレンジトークン ― JR東日本 / jre-is（api-challenge.odpt.org）</label>
    <input id="lgCKey" type="password" placeholder="challenge access token" autocomplete="off" spellcheck="false">

    <label class="lg-chk"><input id="lgSave" type="checkbox" checked> この端末に保存する</label>

    <div class="lg-btns">
      <button id="lgStart">開始</button>
      <button id="lgDemo" class="ghost">デモで見る</button>
    </div>
    <div class="lg-note">
      保存先はこのブラウザのローカルストレージのみで、外部には送信しません。<br>
      URLに <b>?key=…&amp;ckey=…</b> を付けて起動すればこの画面を省略できます。<br>
      起動後に <b>K</b> キーでいつでもこの画面を開けます。
    </div>
  </div>
</div>

<script>
/* =========================================================================
 * 鉄道運行情報 → 台風情報 ローテーション表示オーバーレイ
 * 鉄道: 公共交通オープンデータ ODPT API v4
 * 台風: 気象庁ホームページ内部JSON (bosai/typhoon)
 * ======================================================================= */

const CONFIG = {
  panelRatio: 0.27, panelMin: 240, panelMax: 640,
  baseUnit: 500,     // --u の基準になるパネル幅
  baseHeight: 820,   // --u の基準になるウィンドウ高さ（低いウィンドウで自動縮小）

  cameraEase: 0.8,  // 地図移動の追従率（1で即座に移動・小さいほどゆっくり）
  // 路線ナンバリング画像（HTMLと同じ場所に TrainNum フォルダを置く）
  icons: {
    enabled: true,
    base: 'TrainNum/',
    ext:  '.png',
    plate: true,      // 白フチの記号が暗い背景で消えないよう白い台紙を敷く
  },

  // 天気分布予報（気象庁タイル）
  weather: {
    enabled: true,
    showSec: 12,        // 1コマあたりの表示秒数
    steps: 3,           // 先の時刻を何コマ回すか
    refreshMin: 30,     // 時刻一覧の再取得間隔（分）
    element: 'wm',      // wm=天気 / temp=気温 / r3=3時間降水量 / s3=3時間降雪量
    opacity: 0.88,
    minZoom: 3, maxZoom: 8,
    base: 'https://www.jma.go.jp/bosai/jmatile/data/wdist/',
    legend: [
      ['晴れ',       '#FFAA00'],
      ['くもり',     '#AAAAAA'],
      ['雨',         '#0041FF'],
      ['雨または雪', '#B9D3FF'],
      ['雪',         '#F2F2FF'],
    ],
  },

  // 運行状況アイコン（HTMLと同じ場所に置く。無ければ ✕ △ などの文字で代替）
  statusIcons: {
    enabled: true,
    base: '',
    rules: [
      [/直通運転中止|区間運休|折り返し運転/, 'delay.png'],
      [/見合わせ|運転中止|運休|不通/,        'stopped.png'],
      [/遅延|遅れ/,                          'delay.png'],
      [/ダイヤ乱れ|運転再開|平常運転|平常どおり/, 'resume.png'],
    ],
  },

  rotateSec:  8,     // 鉄道1件あたりの表示秒数
  refreshSec: 60,    // 鉄道情報の再取得間隔
  showNormal: false, // 平常運転も出すか

  mapMode: 'auto',   // 'japan' | 'auto'
  minSpanKm: 17,     // 寄り切ったときに画面幅が示す最小距離（km）
  baseMinSpanKm: 260,// 幹線ネットワーク側の路線に寄るときの最小距離（km）
  fitPadding: 0.10,
  drawRailways: true,

  // 路線図（ルートマップ）風の描き方
  map: {
    theme: 'light',        // 'dark' = 全体ダーク / 'light' = 白地の路線図風
    schematic: true,      // 0/45/90度に整形する
    nodeTarget: 13,       // 1路線あたりの駅ドットの目安数
    nodeMinKm: 1.2,       // 駅ドットの最小間隔（km）
    cornerRadius: 10,     // 角丸の半径（px）
    casing: true,         // 背景色で縁取りして重なりを分離
    glow: true,           // 該当路線のハロー
    haloByStatus: true,   // ハローを運行状況の色にする（遅延=黄 / 見合わせ=赤）
    ticks: true,          // 駅マークを路線図風の直交ダッシュにする
    showNodes: true,      // 該当路線の駅マーク
    showLabels: true,     // 該当路線の駅名
    showAllNodes: true,   // 該当以外の路線にも駅マーク
    showAllLabels: false, // 該当以外の路線にも駅名
    boxedLabels: true,    // 該当路線の駅名をボックス表示にする
    lineNameChip: true,   // 路線名のチップを終端に置く
    labelMinWidth: 380,   // この画面幅未満なら駅名を出さない
    nationalMap: true,    // 全国の幹線ネットワークを背景に描く
    nationalMaxZoom: 14,  // 日本全体表示の何倍まで背景幹線を出すか
    coastWidth: 2.8,      // 海岸線の太さ倍率
    coastFade: false,     // true にすると寄ったとき海岸線を薄くする
    coastMinAlpha: 0.9,   // coastFade 有効時の下限
  },

  typhoon: {
    enabled: true,
    showSec: 12,          // 台風1件あたりの表示秒数
    maxCount: 0,          // 0 = 発表中の台風・熱帯低気圧をすべて表示
    refreshMin: 10,       // 台風情報の再取得間隔（分）
    showForecast: true,   // 予報円・進路を描く
    includeJapan: true,   // 日本列島が入るように地図を引く
    showContinent: true,  // 台風表示中はアジア大陸・周辺島嶼も描く
  },

  sources: [
    { endpoint:'https://api.odpt.org/api/v4/', key:'0vdvchokznzjc9y9vvgm7q628753fksbc0p1jy00lmxtj0vm5vo8gt11bszeqkpj',
      infoOperators:['odpt.Operator:TokyoMetro','odpt.Operator:Toei'],
      geoOperators :['odpt.Operator:TokyoMetro','odpt.Operator:Toei'] },
    { endpoint:'https://api-challenge.odpt.org/api/v4/', key:'53ga9dqxyhsyd0hbn5gngafsug6h80q22914uqijeldhdtf3msku2yzaczep0v05',
      infoOperators:['odpt.Operator:jre-is'],
      geoOperators :['odpt.Operator:JR-East'] },
  ],
};

/* ===== 簡略化した日本の海岸線 [経度, 緯度] ===== */

/* Web メルカトル（気象庁タイルと同じ投影。KX 倍して従来と同程度の尺度にする） */
const R2D = 180 / Math.PI;
const mercY = lat => R2D * Math.log(Math.tan(Math.PI/4 + Math.max(-85, Math.min(85, lat)) * Math.PI/360));
const proj = (lon, lat) => [lon * KX, -mercY(lat) * KX];
const DEG_KM = 111.32;
/* 緯度 lat 付近での「km → 投影単位」換算 */
const kmToUnits = (km, lat) => km * KX / (DEG_KM * Math.cos((lat||36) * Math.PI/180));

function bbox(pts){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const [x,y] of pts){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; }
  return {x0,y0,x1,y1};
}
function unionBox(a,b){
  if(!a) return b; if(!b) return a;
  return {x0:Math.min(a.x0,b.x0), y0:Math.min(a.y0,b.y0),
          x1:Math.max(a.x1,b.x1), y1:Math.max(a.y1,b.y1)};
}

/* ===== 路線図スタイルの整形 =====
 * 1) 駅を最小間隔で間引いてノード化（＝ドットを打つ駅）
 * 2) ノード間を「軸平行 + 45度」の2本に分解して路線図らしい形にする   */
function thinNodes(sts, minDist){
  if (sts.length < 3) return sts.slice();
  const out = [sts[0]];
  for (let i = 1; i < sts.length - 1; i++){
    const a = out[out.length-1].xy, b = sts[i].xy;
    if (Math.hypot(b[0]-a[0], b[1]-a[1]) >= minDist) out.push(sts[i]);
  }
  out.push(sts[sts.length-1]);
  return out.length >= 2 ? out : sts.slice();
}

function octilinear(nodes){
  const path = [nodes[0].xy];
  for (let i = 1; i < nodes.length; i++){
    const a = path[path.length-1], b = nodes[i].xy;
    const dx = b[0]-a[0], dy = b[1]-a[1];
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const sgx = Math.sign(dx), sgy = Math.sign(dy);
    if (adx - ady > 1e-9)      path.push([a[0] + sgx*(adx-ady), a[1]]);
    else if (ady - adx > 1e-9) path.push([a[0], a[1] + sgy*(ady-adx)]);
    path.push(b);
  }
  return path;
}

function buildSchematic(stations){
  const m = CONFIG.map;
  if (!m.schematic) return { path: stations.map(s => s.xy), nodes: stations };
  let len = 0;
  for (let i = 1; i < stations.length; i++){
    const a = stations[i-1].xy, b = stations[i].xy;
    len += Math.hypot(b[0]-a[0], b[1]-a[1]);
  }
  const spacing = Math.max(kmToUnits(m.nodeMinKm, 36),
                           len / Math.max(2, m.nodeTarget));
  const nodes = thinNodes(stations, spacing);
  const path = octilinear(nodes);
  // 各ノードでの進行方向（駅マークを直交させるため）
  for (const n of nodes){
    const i = path.indexOf(n.xy);
    const a = path[i > 0 ? i-1 : 0], b = path[i < path.length-1 ? i+1 : path.length-1];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const d = Math.hypot(dx, dy) || 1;
    n.dir = [dx/d, dy/d];
  }
  return { path, nodes };
}

let BASE_PATHS = [];
let BASE_BY_ID = new Map();
function buildBaseMap(){
  BASE_PATHS = [];
  BASE_BY_ID = new Map();
  for (const L of BASE_LINES){
    const nodes = L.s.filter(n => JP_CITY[n])
                     .map(n => ({ xy: proj(JP_CITY[n][0], JP_CITY[n][1]), name:n }));
    if (nodes.length < 2) continue;
    const path = octilinear(nodes);
    for (const n of nodes){                      // 駅マークの向き
      const i = path.indexOf(n.xy);
      const a = path[i > 0 ? i-1 : 0], b = path[i < path.length-1 ? i+1 : path.length-1];
      const dx = b[0]-a[0], dy = b[1]-a[1], d = Math.hypot(dx, dy) || 1;
      n.dir = [dx/d, dy/d];
    }
    BASE_PATHS.push(path);
    if (L.id){
      const fb = LINE_STYLE[suffix(L.id)] || {};
      BASE_BY_ID.set(L.id, { id:L.id, title:L.name, code:fb.code || '',
        color: L.color || railwayColor(L.id),
        path, nodes, box: bbox(path), isBase: true });
    }
  }
}

/* 角丸でパスをなぞる（screen座標） */
function roundedPath(scr, r){
  ctx.beginPath();
  if (scr.length < 3){ 
    ctx.moveTo(scr[0][0], scr[0][1]);
    for (let i=1;i<scr.length;i++) ctx.lineTo(scr[i][0], scr[i][1]);
    return;
  }
  ctx.moveTo(scr[0][0], scr[0][1]);
  for (let i = 1; i < scr.length - 1; i++){
    const p = scr[i], q = scr[i+1], o = scr[i-1];
    const d1 = Math.hypot(p[0]-o[0], p[1]-o[1]);
    const d2 = Math.hypot(q[0]-p[0], q[1]-p[1]);
    const rr = Math.max(0, Math.min(r, d1/2, d2/2));
    ctx.arcTo(p[0], p[1], q[0], q[1], rr);
  }
  ctx.lineTo(scr[scr.length-1][0], scr[scr.length-1][1]);
}

function statusInfo(s){
  s = s || '';
  // 「直通運転中止」を先に判定（「運転中止」に誤ってマッチするため）
  if (/直通運転中止|区間運休|折り返し運転/.test(s)) return {cls:'st-warn',  mark:'!',sev:3};
  if (/見合わせ|運転中止|運休|不通/.test(s))       return {cls:'st-danger',mark:'✕',sev:4};
  if (/ダイヤ乱れ/.test(s))                      return {cls:'st-ok',    mark:'○',sev:2};
  if (/遅延|遅れ/.test(s))                       return {cls:'st-warn',  mark:'△',sev:3};
  if (/運転再開/.test(s))                        return {cls:'st-ok',    mark:'○',sev:2};
  return {cls:'st-info',mark:'i',sev:1};
}
const isNormal = s => !s || /平常運転|平常どおり|通常どおり/.test(s);

function fmtResume(v){
  if (!v) return '';
  const m = String(v).match(/(\d{1,2}):(\d{2})/);
  if (m) return `${String(m[1]).padStart(2,'0')}:${m[2]}`;
  const d = new Date(v);
  if (!isNaN(d)) return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return String(v);
}
function fmtStamp(v, label){
  const d = v ? new Date(v) : new Date();
  if (isNaN(d)) return '';
  return `${label||''}${d.getMonth()+1}/${d.getDate()} `
       + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 現在`;
}
function directionLabel(id){
  if (!id) return '';
  const k = suffix(id).split('.').pop();
  if (DIRECTION_JA[k]) return DIRECTION_JA[k];
  const st = STATIONS.get(id);
  return st ? st + '方面' : '';
}

/* ===================== レイアウト ===================== */
function layout(){
  const W=innerWidth, H=innerHeight;
  const portrait = W/H < 1.05;
  stage.classList.toggle('portrait', portrait);
  let pw;
  if (portrait){ pw = W; panel.style.width='100%'; panel.style.height='auto'; }
  else {
    pw = Math.max(CONFIG.panelMin, Math.min(W*CONFIG.panelRatio, CONFIG.panelMax));
    panel.style.width = pw+'px'; panel.style.height='100%';
  }
  // 幅と高さの両方から縮尺を決める（1440x380 のような横長でもはみ出さない）
  const uW = (portrait ? Math.min(pw, 700) : pw) / CONFIG.baseUnit;
  const uH = H / CONFIG.baseHeight;
  document.documentElement.style.setProperty('--u', Math.min(uW, uH * (portrait ? 2.2 : 1)));

  requestAnimationFrame(() => {
    const r = wrap.getBoundingClientRect();
    cssW = Math.max(1, Math.round(r.width));
    cssH = Math.max(1, Math.round(r.height));
    const dpr = Math.min(devicePixelRatio||1, 2);
    canvas.width = Math.round(cssW*dpr);
    canvas.height = Math.round(cssH*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    fitStatus(); fitCause();
    setCameraTarget(true);
  });
}
addEventListener('resize', layout);

/* ===================== カメラ ===================== */
function fitCamera(box, pad){
  pad = pad==null ? CONFIG.fitPadding : pad;
  const bw = Math.max(box.x1-box.x0, 1e-6), bh = Math.max(box.y1-box.y0, 1e-6);
  const s = Math.min(cssW/bw, cssH/bh) * (1-pad);
  return { x:(box.x0+box.x1)/2, y:(box.y0+box.y1)/2, s };
}
function areaBox(name){
  const a = AREAS[name]; if(!a) return null;
  const p = proj(a[0],a[1]), hw = a[2]*KX/2, hh = a[2]/2;
  return {x0:p[0]-hw, y0:p[1]-hh, x1:p[0]+hw, y1:p[1]+hh};
}
function setCameraTarget(snap){
  if (!cssW) return;
  const whole = fitCamera(japanBox);
  let t = whole;

  if (SCENE === 'weather'){
    t = whole;
  } else if (SCENE === 'typhoon'){
    const ty = TYPHOONS[tIdx];
    if (ty){
      let b = bbox(ty.track.map(p => p.xy));
      const pad = kmToUnits(ty.now.stormKm || ty.now.galeKm || 300, ty.now.lat);
      b = {x0:b.x0-pad, y0:b.y0-pad, x1:b.x1+pad, y1:b.y1+pad};
      if (CONFIG.typhoon.includeJapan) b = unionBox(b, japanBox);
      t = fitCamera(b, 0.12);
    }
  } else if (CONFIG.mapMode === 'auto'){
    const it = ITEMS[cursor];
    const rw = it && (RAILWAYS.get(it.railway) || BASE_BY_ID.get(it.railway));
    let box = rw ? rw.box : (it && it.area ? areaBox(it.area) : null);
    if (box){
      const f = fitCamera(box, 0.30);
      // 幹線データは駅が粗いので、寄りすぎず周囲の路線網が見える距離で止める
      const span = (rw && rw.isBase) ? CONFIG.baseMinSpanKm : CONFIG.minSpanKm;
      const maxS = cssW / kmToUnits(span, 36);
      t = { x:f.x, y:f.y, s: Math.min(f.s, maxS) };
    }
  }
  camT = t;
  if (snap || !cam) cam = { ...t };
  requestDraw();
}

/* ===================== 描画 ===================== */
function drawMap(){
  if (!cam) return;
  const cs = getComputedStyle(document.documentElement);
  const V  = k => cs.getPropertyValue(k).trim();
  ctx.clearRect(0,0,cssW,cssH);
  ctx.fillStyle = V('--map-bg') || '#dfe4ea';
  ctx.fillRect(0,0,cssW,cssH);

  const sx = p => (p[0]-cam.x)*cam.s + cssW/2;
  const sy = p => (p[1]-cam.y)*cam.s + cssH/2;
  const path = pts => { ctx.beginPath();
    for (let i=0;i<pts.length;i++){ const x=sx(pts[i]), y=sy(pts[i]);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); } };
  const rpx = (km, lat) => kmToUnits(km, lat) * cam.s;

  ctx.lineCap='round'; ctx.lineJoin='round';
  const lw = Math.max(0.8, Math.min(2.2, cssH/520));
  const M  = CONFIG.map;

  // 大陸・周辺島嶼（台風表示中のみ）
  if (SCENE === 'typhoon' && CONFIG.typhoon.showContinent){
    ctx.strokeStyle = V('--map-cont');
    ctx.fillStyle   = V('--map-contfill');
    ctx.lineWidth   = lw * 1.1;
    for (const pts of CONT_PATHS){
      const a = pts[0], b = pts[pts.length-1];
      const closed = Math.abs(a[0]-b[0]) < 1e-9 && Math.abs(a[1]-b[1]) < 1e-9;
      path(pts);
      if (closed) ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = V('--map-cont');
    const dr = Math.max(1.2, lw * 1.1);
    for (const p of DOT_PTS){
      ctx.beginPath(); ctx.arc(sx(p), sy(p), dr, 0, Math.PI*2); ctx.fill();
    }
  }

  // --- 天気分布予報：タイルの上に海岸線の輪郭だけ重ねる ---
  if (SCENE === 'weather'){
    drawWeatherTiles();
    ctx.strokeStyle = V('--map-coast');
    ctx.lineWidth = lw * M.coastWidth;
    for (const pts of JP_PATHS){ path(pts); ctx.closePath(); ctx.stroke(); }
    ctx.strokeStyle = V('--map-cont');
    ctx.lineWidth = lw * 1.1;
    for (const pts of CONT_PATHS){ path(pts); ctx.stroke(); }
    return;
  }

  // 海岸線（陸を塗って境界をはっきり出す）
  const wholeS = Math.min(cssW/(japanBox.x1-japanBox.x0), cssH/(japanBox.y1-japanBox.y0))
               * (1 - CONFIG.fitPadding);
  const zr = cam.s / wholeS;
  const coastA = (SCENE === 'typhoon' || !M.coastFade)
    ? 1 : Math.max(M.coastMinAlpha, Math.min(1, 2 / zr));
  ctx.save();
  ctx.globalAlpha = coastA;
  ctx.fillStyle = V('--map-land');
  for (const pts of JP_PATHS){ path(pts); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle = V('--map-coast');
  ctx.lineWidth = lw * M.coastWidth;
  for (const pts of JP_PATHS){ path(pts); ctx.closePath(); ctx.stroke(); }
  ctx.restore();

  if (SCENE === 'typhoon'){ drawTyphoon(sx, sy, rpx, lw, cs); return; }

  const activeId = ITEMS[cursor] && ITEMS[cursor].railway;
  const item = ITEMS[cursor];
  const act  = RAILWAYS.get(activeId) || BASE_BY_ID.get(activeId);
  const mapBg   = V('--map-bg');
  const railCol = V('--map-rail');
  const nodeCol = V('--map-node');
  const labelCol= V('--map-label');
  const labelBg = V('--map-labelbg');
  const labelBd = V('--map-labelbd');
  const toScr = pts => pts.map(p => [sx(p), sy(p)]);
  const R = M.cornerRadius;

  const wBase = lw * 2.4, wCase = lw * 1.6, wCore = lw * 3.4;

  // 駅マーク（進行方向に直交する短いダッシュ）
  const tick = (n, len, w, color) => {
    const d = n.dir || [1,0];
    const nx = -d[1], ny = d[0];
    const x = sx(n.xy), y = sy(n.xy);
    if (x < -30 || x > cssW+30 || y < -30 || y > cssH+30) return;
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(x - nx*len, y - ny*len);
    ctx.lineTo(x + nx*len, y + ny*len);
    ctx.stroke();
  };
  const dot = (n, r, fill, stroke, w) => {
    const x = sx(n.xy), y = sy(n.xy);
    if (x < -30 || x > cssW+30 || y < -30 || y > cssH+30) return;
    ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = w;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  };

  // ---- 全国の幹線ネットワーク（背景） ----
  const actIsBase = !!(activeId && BASE_BY_ID.has(activeId) && !RAILWAYS.has(activeId));
  if (M.nationalMap && BASE_PATHS.length && (actIsBase || zr <= M.nationalMaxZoom)){
    const skip = actIsBase ? BASE_BY_ID.get(activeId).path : null;
    ctx.strokeStyle = V('--map-base');
    ctx.lineWidth = Math.max(1.2, lw * 2.0);
    for (const pts of BASE_PATHS){
      if (pts === skip) continue;
      roundedPath(toScr(pts), R); ctx.stroke();
    }
  }

  // ---- 通常の路線 ----
  if (CONFIG.drawRailways && RAILWAYS.size){
    for (const rw of RAILWAYS.values()){
      if (rw.id === activeId) continue;
      const scr = toScr(rw.path);
      if (M.casing){
        ctx.strokeStyle = mapBg; ctx.lineWidth = wBase + wCase;
        roundedPath(scr, R); ctx.stroke();
      }
      ctx.strokeStyle = railCol; ctx.lineWidth = wBase;
      roundedPath(scr, R); ctx.stroke();
    }
    if (M.showAllNodes){
      for (const rw of RAILWAYS.values()){
        if (rw.id === activeId || !rw.nodes) continue;
        for (const n of rw.nodes){
          if (M.ticks) tick(n, wBase * 0.78, Math.max(1.3, lw * 1.1), nodeCol);
          else dot(n, Math.max(1.6, lw*1.3), nodeCol, railCol, Math.max(1, lw*0.8));
        }
      }
    }
  }

  // ---- 該当路線 ----
  if (act){
    const col = (item && item.color) || act.color;
    const halo = (M.haloByStatus && item) ? haloColor(item.status, V) : col;
    const scr = toScr(act.path);

    if (M.glow){
      ctx.save();
      ctx.strokeStyle = halo;
      // 幅の広い半透明バンドで路線図らしい「にじみ」を作る
      ctx.globalAlpha = 0.20; ctx.lineWidth = wCore * 3.4; roundedPath(scr, R); ctx.stroke();
      ctx.globalAlpha = 0.32; ctx.lineWidth = wCore * 2.1; roundedPath(scr, R); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.shadowColor = halo; ctx.lineWidth = wCore * 1.15;
      for (const b of [wCore * 2.6, wCore * 1.3]){
        ctx.shadowBlur = b; roundedPath(scr, R); ctx.stroke();
      }
      ctx.restore();
    }
    if (M.casing){
      ctx.strokeStyle = mapBg; ctx.lineWidth = wCore + lw * 2.0;
      roundedPath(scr, R); ctx.stroke();
    }
    ctx.strokeStyle = col; ctx.lineWidth = wCore;
    roundedPath(scr, R); ctx.stroke();

    if (M.showNodes && act.nodes){
      for (const n of act.nodes){
        if (M.ticks) tick(n, wCore * 0.68, Math.max(1.4, lw * 1.3), nodeCol);
        else dot(n, Math.max(2.2, lw*1.9), nodeCol, col, Math.max(1.2, lw*1.1));
      }
    }
  } else if (item && item.area && AREAS[item.area]){
    const a = AREAS[item.area], p = proj(a[0],a[1]);
    const x = sx(p), y = sy(p), t = (Date.now()%1800)/1800;
    const r = Math.max(12, cssH*0.03)*(1+t*1.6);
    ctx.strokeStyle = item.color || '#ff3b30';
    ctx.globalAlpha = 1-t; ctx.lineWidth = lw*1.6;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = item.color || '#ff3b30';
    ctx.beginPath(); ctx.arc(x,y,Math.max(4,cssH*0.008),0,Math.PI*2); ctx.fill();
  }

  // ---- 駅名（該当路線を優先し、重複と衝突を除く） ----
  const placed = [];
  if (M.showLabels && cssW >= M.labelMinWidth && RAILWAYS.size){
    const jobs = [];
    if (act) jobs.push({ rw: act, active: true });
    if (M.showAllLabels){
      for (const rw of RAILWAYS.values()) if (rw !== act) jobs.push({ rw, active: false });
    }
    const fsA = Math.max(11, Math.min(18, cssH * 0.021));
    const seen = new Set();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';

    for (const job of jobs){
      const fs = job.active ? fsA : fsA * 0.86;
      const off = (job.active ? wCore : wBase) * 0.8 + fs * 0.4;
      ctx.font = `${job.active ? 700 : 400} ${fs}px "Noto Sans JP",sans-serif`;
      for (const n of (job.rw.nodes || [])){
        if (!n.name || seen.has(n.name)) continue;
        const x = sx(n.xy) + off, y = sy(n.xy);
        if (x < 0 || x > cssW - 8 || y < 10 || y > cssH - 10) continue;
        const w = ctx.measureText(n.name).width;
        if (placed.some(q => Math.abs(q.y-y) < fs*1.15 && x < q.x+q.w+fs*0.35 && q.x < x+w+fs*0.35)) continue;
        placed.push({ x, y, w });
        seen.add(n.name);
        if (job.active && M.boxedLabels){
          const px = fs*0.40, py = fs*0.32, rr = fs*0.28;
          ctx.fillStyle = labelBg; ctx.strokeStyle = labelBd; ctx.lineWidth = 1;
          roundRect(x - px, y - fs/2 - py, w + px*2, fs + py*2, rr);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = labelCol; ctx.fillText(n.name, x, y);
        } else {
          ctx.strokeStyle = mapBg; ctx.lineWidth = fs * 0.45;
          ctx.strokeText(n.name, x, y);
          ctx.fillStyle = labelCol; ctx.fillText(n.name, x, y);
        }
      }
    }
  }

  // ---- 路線名チップ（該当路線の終端） ----
  if (M.lineNameChip && act && act.nodes && act.nodes.length){
    const fs = Math.max(11, Math.min(19, cssH * 0.023));
    ctx.font = `700 ${fs}px "Noto Sans JP",sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const title = act.title;
    const w = ctx.measureText(title).width;
    const sq = fs * 0.9, gap = fs * 0.4, px = fs * 0.45, py = fs * 0.34;
    const bw = sq + gap + w + px*2, bh = Math.max(sq, fs) + py*2;
    // 画面内で駅名と当たらない終端を選ぶ
    let best = null;
    for (const n of [act.nodes[0], act.nodes[act.nodes.length-1], act.nodes[(act.nodes.length/2)|0]]){
      const x = sx(n.xy) + fs*0.9, y = sy(n.xy) - fs*1.6;
      if (x < 4 || x + bw > cssW - 4 || y - bh/2 < 4 || y + bh/2 > cssH - 4) continue;
      if (placed.some(q => Math.abs(q.y-y) < bh*0.9 && x < q.x+q.w+8 && q.x < x+bw+8)) continue;
      best = {x, y}; break;
    }
    if (best){
      ctx.fillStyle = labelBg; ctx.strokeStyle = labelBd; ctx.lineWidth = 1;
      roundRect(best.x - px, best.y - bh/2, bw, bh, fs*0.3);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = (item && item.color) || act.color;
      roundRect(best.x, best.y - sq/2, sq, sq, sq*0.22); ctx.fill();
      ctx.fillStyle = labelCol;
      ctx.fillText(title, best.x + sq + gap, best.y);
    }
  }
}

function roundRect(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

/* 運行状況からハローの色を決める */
function haloColor(status, V){
  const s = status || '';
  if (/見合わせ|運転中止|運休|不通/.test(s)) return V('--danger') || '#ff3b30';
  if (/遅延|遅れ|直通運転中止|区間運休|折り返し/.test(s)) return V('--warn') || '#ffcc00';
  if (/運転再開/.test(s)) return V('--ok') || '#33d17a';
  return V('--info') || '#4da3ff';
}

function drawTyphoon(sx, sy, rpx, lw, cs){
  const ty = TYPHOONS[tIdx];
  if (!ty) return;
  const COL  = cs.getPropertyValue('--typhoon').trim() || '#ff5a5a';
  const GALE = cs.getPropertyValue('--gale').trim()    || '#ffd24d';
  const trackCol = cs.getPropertyValue('--map-track').trim() || '#33383f';

  // 予想進路
  if (CONFIG.typhoon.showForecast && ty.track.length > 1){
    ctx.save();
    ctx.setLineDash([lw*5, lw*4]);
    ctx.strokeStyle = trackCol;
    ctx.lineWidth = lw*1.6;
    ctx.beginPath();
    ty.track.forEach((p,i) => {
      const x = sx(p.xy), y = sy(p.xy);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.stroke();
    ctx.restore();

    // 予報円
    for (const p of ty.track){
      if (!p.circleKm) continue;
      const x = sx(p.xy), y = sy(p.xy), r = rpx(p.circleKm, p.lat);
      ctx.save();
      ctx.setLineDash([lw*3, lw*3]);
      ctx.strokeStyle = trackCol;
      ctx.lineWidth = lw*1.3;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      // 何時間後か
      if (p.hours){
        const tf = Math.max(10, cssH*0.022);
        ctx.font = `600 ${tf}px "Noto Sans JP",sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = cs.getPropertyValue('--map-bg').trim();
        ctx.lineWidth = tf*0.45;
        ctx.strokeText(`${p.hours}h`, x, y - r - lw*2);
        ctx.fillStyle = trackCol;
        ctx.fillText(`${p.hours}h`, x, y - r - lw*2);
      }
    }
  }

  // 実況の強風域・暴風域
  const now = ty.now, c = now.xy;
  const cx = sx(c), cy = sy(c);
  if (now.galeKm){
    ctx.fillStyle = 'rgba(255,210,77,.13)';
    ctx.strokeStyle = 'rgba(255,210,77,.5)'; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(cx,cy,rpx(now.galeKm, now.lat),0,Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  if (now.stormKm){
    ctx.fillStyle = 'rgba(255,90,90,.22)';
    ctx.strokeStyle = 'rgba(255,90,90,.75)'; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(cx,cy,rpx(now.stormKm, now.lat),0,Math.PI*2);
    ctx.fill(); ctx.stroke();
  }

  // 中心マーク（脈動リング＋×印）
  const t = (Date.now()%2000)/2000;
  ctx.save();
  ctx.strokeStyle = COL; ctx.globalAlpha = 1-t; ctx.lineWidth = lw*2;
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(10, cssH*0.018)*(1+t*1.8), 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();

  const m = Math.max(7, cssH*0.014);
  ctx.strokeStyle = COL; ctx.lineWidth = lw*2.4;
  ctx.beginPath();
  ctx.moveTo(cx-m, cy-m); ctx.lineTo(cx+m, cy+m);
  ctx.moveTo(cx+m, cy-m); ctx.lineTo(cx-m, cy+m);
  ctx.stroke();
}

let dirty = true;
function requestDraw(){ dirty = true; }

function tick(){
  if (cam && camT){
    const e = Math.max(0.02, Math.min(1, CONFIG.cameraEase));
    const dx = camT.x-cam.x, dy = camT.y-cam.y, ds = camT.s-cam.s;
    // 残りが十分小さくなったら惰性を切って止める（だらだら動き続けない）
    if (Math.abs(dx) < 1e-7 && Math.abs(dy) < 1e-7 && Math.abs(ds) < camT.s*1e-4){
      if (cam.x !== camT.x || cam.y !== camT.y || cam.s !== camT.s){
        cam = { ...camT }; dirty = true;
      }
    } else {
      cam.x += dx*e; cam.y += dy*e; cam.s += ds*e; dirty = true;
    }
  }
  // 点滅マーカーがある間は描き続ける
  const it = ITEMS[cursor];
  if (SCENE === 'typhoon' || (it && !RAILWAYS.get(it.railway))) dirty = true;
  if (dirty){ drawMap(); dirty = false; }
  requestAnimationFrame(tick);
}

/* ===================== ODPT ===================== */
async function odpt(src, type, params={}){
  const u = new URL(src.endpoint + type);
  for (const [k,v] of Object.entries(params)) u.searchParams.set(k,v);
  u.searchParams.set('acl:consumerKey', src.key);
  const r = await fetch(u.toString(), {cache:'no-store'});
  if (!r.ok) throw new Error(`${type} ${r.status}`);
  return r.json();
}
const keyOk = s => s.key && !/^(ACL_CONSUMERKEY|CHALLENGE_ACCESS_TOKEN|)$/.test(s.key);

async function loadGeometry(){
  const rails=[], coords=new Map();
  for (const src of CONFIG.sources){
    if (!keyOk(src)) continue;
    for (const op of (src.geoOperators||[])){
      try {
        const [rws, sts] = await Promise.all([
          odpt(src,'odpt:Railway',{'odpt:operator':op}),
          odpt(src,'odpt:Station',{'odpt:operator':op}),
        ]);
        rails.push(...rws);
        for (const rw of rws){                       // 形状の有無に関わらず名前は控えておく
          const t = ja(rw['odpt:railwayTitle']) || rw['dc:title'];
          if (t) RAIL_TITLE.set(rw['owl:sameAs'], t);
        }
        for (const s of sts){
          const id = s['owl:sameAs'];
          if (s['geo:lat']!=null && s['geo:long']!=null)
            coords.set(id, proj(+s['geo:long'], +s['geo:lat']));
          const t = ja(s['odpt:stationTitle']) || s['dc:title'];
          if (t) STATIONS.set(id, t);
        }
      } catch(e){ console.warn('geometry', op, e.message); }
    }
  }
  for (const rw of rails){
    const stations = (rw['odpt:stationOrder']||[]).slice()
      .sort((a,b)=>(a['odpt:index']||0)-(b['odpt:index']||0))
      .map(o => {
        const xy = coords.get(o['odpt:station']);
        return xy ? { xy, name: STATIONS.get(o['odpt:station']) || '' } : null;
      }).filter(Boolean);
    if (stations.length < 2) continue;
    const id = rw['owl:sameAs'], sfx = suffix(id), fb = LINE_STYLE[sfx]||{};
    const sch = buildSchematic(stations);
    RAILWAYS.set(id, {
      id, title: railwayName(id, ja(rw['odpt:railwayTitle']) || rw['dc:title']),
      code: rw['odpt:lineCode']||fb.code||'',
      color: railwayColor(id, rw['odpt:color']),
      stations, path: sch.path, nodes: sch.nodes, box: bbox(sch.path),
    });
  }
}

async function loadInfo(){
  const out=[];
  for (const src of CONFIG.sources){
    if (!keyOk(src)) continue;
    for (const op of (src.infoOperators||[])){
      try {
        const rows = await odpt(src,'odpt:TrainInformation',{'odpt:operator':op});
        for (const r of rows){
          const st = ja(r['odpt:trainInformationStatus']);
          if (!CONFIG.showNormal && isNormal(st)) continue;
          const rid = r['odpt:railway'], rw = RAILWAYS.get(rid);
          const fb = LINE_STYLE[suffix(rid)]||{};
          out.push({
            railway:rid,
            title: railwayName(rid,
                     ja(r['odpt:railwayTitle']) || (rw && rw.title) || RAIL_TITLE.get(rid)),
            code:  (rw&&rw.code)||fb.code||'',
            color: (rw&&rw.color)||fb.color||'#9aa4c0',
            status: st||'お知らせ',
            direction: directionLabel(r['odpt:railDirection']),
            range: ja(r['odpt:trainInformationRange']),
            area:  ja(r['odpt:trainInformationArea']),
            cause: ja(r['odpt:trainInformationCause']),
            text:  ja(r['odpt:trainInformationText']),
            resume: fmtResume(r['odpt:resumeEstimate']),
            time:  r['dc:date']||r['odpt:timeOfOrigin']||'',
          });
        }
      } catch(e){ console.warn('info', op, e.message); }
    }
  }
  return out;
}

/* ===================== 気象庁 台風情報 ===================== */
const JMA_BASE = 'https://www.jma.go.jp/bosai/typhoon/data/';

function pickPart(p){
  const pos = p.position && p.position.deg;
  if (!pos) return null;
  const speed = p.speed || {};
  const wind  = p.maximumWind && p.maximumWind.sustained;
  const gust  = p.maximumWind && p.maximumWind.gust;
  const km = arr => {
    if (!arr || !arr.length) return 0;
    return Math.max(...arr.map(a => (a.range && a.range.km) || 0));
  };
  return {
    label: ja(p.part) || String(p.part||''),
    hours: p.advancedHours || 0,
    xy: proj(pos[1], pos[0]),
    lat: pos[0], lon: pos[1],
    location: p.location || '',
    category: ja(p.category) || '',
    scale: p.scale && p.scale !== '-' ? p.scale : '',
    intensity: p.intensity && p.intensity !== '-' ? p.intensity : '',
    pressure: p.pressure || '',
    course: p.course || '',
    speed: speed['km/h'] ? speed['km/h']+'km/h' : (ja(speed.note) || ''),
    wind: wind && wind['m/s'] && wind['m/s'] !== '0' ? wind['m/s'] : '',
    windNote: (wind && wind.note) || '',
    gust: gust && gust['m/s'] ? gust['m/s'] : '',
    stormKm: km(p.stormWarning),
    galeKm:  km(p.galeWarning),
    circleKm: (p.probabilityCircleRadius && p.probabilityCircleRadius.km) || 0,
    valid: (p.validtime && p.validtime.JST) || '',
  };
}

function parseSpec(spec){
  const title = spec.find(p => p.part === 'title');
  if (!title) return null;
  const parts = spec.filter(p => p.part && p.part !== 'title').map(pickPart).filter(Boolean);
  if (!parts.length) return null;

  const now = parts.find(p => /実況/.test(p.label)) || parts[0];
  const rest = parts.filter(p => p !== now)
                    .sort((a,b) => a.hours - b.hours);
  const no = String(title.typhoonNumber || '');
  return {
    id: title.tropicalCyclone || no,
    no,
    isTyphoon: no.length > 2 ? 1 : 0,
    heading: no.length > 2 ? `台風${+no.slice(-2)}号` : `熱帯低気圧${no}`,
    name: title.name ? [title.name.jp, title.name.en].filter(Boolean).join(' / ') : '',
    issue: (title.issue && title.issue.JST) || '',
    now, track: [now, ...rest],
  };
}

async function loadTyphoons(){
  if (!CONFIG.typhoon.enabled) return [];
  try {
    const list = await (await fetch(JMA_BASE+'targetTc.json', {cache:'no-store'})).json();
    const cap = CONFIG.typhoon.maxCount;
    const targets = (cap && cap > 0) ? list.slice(0, cap) : list;   // 0 なら全件
    const specs = await Promise.all(targets.map(async t => {
      const id = t.tropicalCyclone;
      try {
        const r = await fetch(`${JMA_BASE}${id}/specifications.json`, {cache:'no-store'});
        return parseSpec(await r.json());
      } catch(e){ console.warn('typhoon spec', id, e.message); return null; }
    }));
    // 台風→熱帯低気圧の順、その中は番号順
    return specs.filter(Boolean).sort((a,b) =>
      (b.isTyphoon - a.isTyphoon) || String(a.no).localeCompare(String(b.no)));
  } catch(e){ console.warn('typhoon list', e.message); return []; }
}


/* ===================== 気象庁 天気分布予報タイル ===================== */
const TILE_CACHE = new Map();
function getTile(url){
  let e = TILE_CACHE.get(url);
  if (e) return e;
  e = { img: new Image(), ok:false, bad:false };
  e.img.crossOrigin = 'anonymous';
  e.img.onload  = () => { e.ok = true;  requestDraw(); };
  e.img.onerror = () => { e.bad = true; };
  e.img.src = url;
  TILE_CACHE.set(url, e);
  if (TILE_CACHE.size > 600){                 // 古いものから捨てる
    const k = TILE_CACHE.keys().next().value;
    if (k !== url) TILE_CACHE.delete(k);
  }
  return e;
}

function tileUrl(f, z, x, y){
  const W = CONFIG.weather;
  return `${W.base}${f.basetime}/none/${f.validtime}/surf/${W.element}/${z}/${x}/${y}.png`;
}

/* 投影座標 <-> Web メルカトルのタイル座標 */
const pxToLon   = px => px / KX;
const pyToMercY = py => -py / KX;
const lonToPx   = lon => lon * KX;
const mercYToPy = my => -my * KX;

function drawWeatherTiles(){
  const f = WFRAMES[wIdx];
  if (!f) return;
  const W = CONFIG.weather;

  // 画面上でタイルが約256pxになるズームを選ぶ
  const nWanted = 360 * KX * cam.s / 256;
  let z = Math.round(Math.log2(Math.max(1, nWanted)));
  z = Math.max(W.minZoom, Math.min(W.maxZoom, z));
  const n = 1 << z;

  // 表示範囲を投影座標 → タイル番号へ
  const px0 = (0      - cssW/2)/cam.s + cam.x, px1 = (cssW - cssW/2)/cam.s + cam.x;
  const py0 = (0      - cssH/2)/cam.s + cam.y, py1 = (cssH - cssH/2)/cam.s + cam.y;
  const tX = px => (pxToLon(px) + 180) / 360 * n;
  const tY = py => (1 - pyToMercY(py) / 180) / 2 * n;

  const x0 = Math.max(0, Math.floor(tX(px0))), x1 = Math.min(n-1, Math.floor(tX(px1)));
  const y0 = Math.max(0, Math.floor(tY(py0))), y1 = Math.min(n-1, Math.floor(tY(py1)));
  if (x1 < x0 || y1 < y0) return;
  if ((x1-x0+1)*(y1-y0+1) > 260) return;      // 念のための上限

  const sxp = px => (px - cam.x)*cam.s + cssW/2;
  const syp = py => (py - cam.y)*cam.s + cssH/2;

  ctx.save();
  ctx.globalAlpha = W.opacity;
  ctx.imageSmoothingEnabled = true;
  for (let x = x0; x <= x1; x++){
    for (let y = y0; y <= y1; y++){
      const e = getTile(tileUrl(f, z, x, y));
      if (!e.ok) continue;
      const L = sxp(lonToPx(x / n * 360 - 180));
      const R = sxp(lonToPx((x+1) / n * 360 - 180));
      const T = syp(mercYToPy(180 * (1 - 2 * y / n)));
      const B = syp(mercYToPy(180 * (1 - 2 * (y+1) / n)));
      ctx.drawImage(e.img, L, T, Math.ceil(R-L)+1, Math.ceil(B-T)+1);
    }
  }
  ctx.restore();
}

async function loadWeather(){
  const W = CONFIG.weather;
  if (!W.enabled) return [];
  try {
    const list = await (await fetch(W.base + 'targetTimes.json', {cache:'no-store'})).json();
    const now = Date.now();
    const parse = t => {                       // 'YYYYMMDDhhmmss'（JST）
      const m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)/.exec(String(t));
      return m ? new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00+09:00`) : null;
    };
    const rows = list.map(r => ({ ...r, vt: parse(r.validtime) }))
                     .filter(r => r.vt)
                     .sort((a,b) => a.vt - b.vt);
    const future = rows.filter(r => r.vt.getTime() >= now - 30*60*1000);
    const pick = (future.length ? future : rows.slice(-W.steps)).slice(0, W.steps);
    return pick;
  } catch(e){ console.warn('wdist', e.message); return []; }
}

                        .filter(Boolean);

    const sch = buildSchematic(stations);

      stations, path:sch.path, nodes:sch.nodes, box:bbox(sch.path) });
  }
}

/* ===================== パネル描画 ===================== */

/* 路線に対応するナンバリング画像のURL（無ければ null） */
const ICON_MISSING = new Set();
function iconFor(item){
  const I = CONFIG.icons;
  if (!I || !I.enabled || !item) return null;
  const name = ICON_MAP[suffix(item.railway)] || (item.code || '');
  if (!name || ICON_MISSING.has(name)) return null;
  return I.base + name + I.ext;
}


/* 左端の路線カラーバー */
function luminance(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if (!m) return 0.5;
  const v = parseInt(m[1], 16);
  const r = (v>>16&255)/255, g = (v>>8&255)/255, b = (v&255)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function setEdgeBar(color, cur, total){
  const el = $('edgeBar');
  if (color === false){                    // 鉄道以外のシーンではバーを出さない
    el.classList.add('hide');
    panel.classList.add('nobar');
    return;
  }
  el.classList.remove('hide');
  panel.classList.remove('nobar');
  const cs = getComputedStyle(document.documentElement);
  const c  = color || cs.getPropertyValue('--ok').trim() || '#33d17a';
  el.style.background = c;
  el.style.setProperty('--bar-fg', luminance(c) > 0.62 ? '#111' : '#fff');
  $('barCur').textContent = total ? String(cur) : '';
  $('barTot').textContent = total ? String(total) : '';
  el.querySelector('.sep').style.display = total ? '' : 'none';
}

/* 運行状況アイコン */
const SICON_MISSING = new Set();
function statusIconFor(status){
  const S = CONFIG.statusIcons;
  if (!S || !S.enabled) return null;
  for (const [re, file] of S.rules){
    if (re.test(status || '')){
      const url = S.base + file;
      return SICON_MISSING.has(url) ? null : url;
    }
  }
  return null;
}

function setMark(el, status, si){
  const plain = () => { el.className = 'mark'; el.textContent = si.mark; };
  const url = statusIconFor(status);
  if (!url){ plain(); return; }
  el.className = 'mark icon';
  el.textContent = '';
  const img = new Image();
  img.alt = si.mark;
  img.onerror = () => { SICON_MISSING.add(url); plain(); };
  img.src = url;
  el.appendChild(img);
}

/* バッジを画像 or 従来の色付き四角で描く */
function setBadge(el, item){
  const url = iconFor(item);
  const code = (item && item.code) || '';
  const plain = () => {
    el.className = code ? 'badge' : 'badge empty';
    el.style.background = (item && item.color) || 'transparent';
    el.textContent = code;
  };
  if (!url){ plain(); return; }
  el.className = 'badge icon' + (CONFIG.icons.plate ? ' plate' : '');
  el.style.background = '';
  el.textContent = '';
  const img = new Image();
  img.alt = code;
  img.onerror = () => {                     // 画像が無ければ従来表示に戻す
    ICON_MISSING.add(ICON_MAP[suffix(item.railway)] || code);
    plain();
  };
  img.src = url;
  el.appendChild(img);
}

function shrinkToFit(el, basePx, minPx, maxW){
  let size = basePx;
  el.style.fontSize = size + 'px';
  while (el.scrollWidth > maxW && size > minPx){ size -= 1; el.style.fontSize = size + 'px'; }
}

function fitCause(){
  const el = $('causeText');
  if (!el || $('cardTrain').classList.contains('hide')) return;
  el.style.webkitLineClamp = 99;
  const cs = getComputedStyle(el);
  const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.45;
  const pr = panel.getBoundingClientRect();
  const top = el.getBoundingClientRect().top - pr.top;
  const foot = panel.querySelector('.footer');
  const avail = panel.clientHeight - top - (foot ? foot.offsetHeight : 0)
              - parseFloat(getComputedStyle(panel).paddingBottom) - 4;
  el.style.webkitLineClamp = Math.max(1, Math.floor(avail / lh));
}

function fitStatus(){
  const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 1;
  const row = $('statusRow');
  const avail = row.clientWidth - $('mark').offsetWidth - 14*u - 2;
  shrinkToFit($('status'), 60*u, 22*u, avail);
}

function fitLineName(el){
  const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1;
  const max = panel.clientWidth - 2*26*u - 86*u - 16*u;
  let size = 86*u; el.style.fontSize = size+'px';
  while (el.scrollWidth > max && size > 20*u){ size -= 2*u; el.style.fontSize = size+'px'; }
}

const SCENE_TITLE = { train:'鉄道運行情報', typhoon:'台風情報', weather:'天気分布予報' };
function showCard(which){
  $('cardTrain').classList.toggle('hide', which!=='train');
  $('cardTyphoon').classList.toggle('hide', which!=='typhoon');
  $('cardWx').classList.toggle('hide', which!=='weather');
  $('pTitle').textContent = SCENE_TITLE[which] || '鉄道運行情報';
}

const CARD_OF = { train:'cardTrain', typhoon:'cardTyphoon', weather:'cardWx' };
function fade(fn){
  const c = $(CARD_OF[SCENE] || 'cardTrain');
  for (const id of Object.values(CARD_OF)) if (id !== c.id) $(id).classList.add('out');
  c.classList.add('out');
  setTimeout(() => { fn(); setCameraTarget(); c.classList.remove('out'); }, 300);
}

function renderTrain(){
  SCENE = 'train';
  fade(() => {
    showCard('train');
    const it = ITEMS[cursor];
    if (!it){
      $('badge').className='badge empty';
      $('lineName').textContent='運行情報なし'; fitLineName($('lineName'));
      $('lineSub').textContent='';
      $('statusRow').className='status-row st-ok';
      $('mark').className='mark'; $('mark').textContent='○';
      $('status').textContent='平常運転';
      requestAnimationFrame(() => { fitStatus(); fitCause(); });
      $('resume').className='resume hide'; $('resume').textContent='';
      $('causeText').textContent='各線とも平常どおり運転しています。';
      $('stamp').textContent = fmtStamp(null);
      setMark($('mark'), '平常運転', {mark:'○'});
      setEdgeBar(null, 0, 0);
    } else {
      const si = statusInfo(it.status);
      setBadge($('badge'), it);
      $('lineName').textContent = it.title; fitLineName($('lineName'));
      $('lineSub').textContent = [it.direction, it.range].filter(Boolean).join(' ');
      $('statusRow').className = 'status-row '+si.cls;
      setMark($('mark'), it.status, si);
      $('status').textContent = it.status;
      requestAnimationFrame(() => { fitStatus(); fitCause(); });
      $('resume').className = 'resume' + (it.resume ? '' : ' hide');
      $('resume').textContent = it.resume ? '再開見込 '+it.resume : '';
      $('causeText').textContent = it.cause || it.text || '―';
      $('stamp').textContent = fmtStamp(it.time);
      setEdgeBar(it.color, cursor + 1, ITEMS.length);
    }
    $('src').textContent = demoMode ? 'DEMO / 公共交通オープンデータ' : '公共交通オープンデータセンター';
    renderDots();
  });
}

function renderTyphoon(){
  SCENE = 'typhoon';
  fade(() => {
    showCard('typhoon');
    const ty = TYPHOONS[tIdx]; if (!ty) return;
    const n = ty.now;
    $('tyNo').textContent = ty.heading;
    $('tyName').textContent = ty.name;
    $('tyGrade').textContent = [n.scale, n.intensity, n.category].filter(Boolean).join(' ');
    $('tyLoc').textContent = n.location ? n.location + ' を進行中' : '';

    const rows = [];
    const add = (k,v) => { if (v) rows.push(`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`); };
    add('中心気圧', n.pressure ? n.pressure+' hPa' : '');
    add((n.windNote ? n.windNote+'の' : '')+'最大風速', n.wind ? n.wind+' m/s' : '');
    add('最大瞬間風速', n.gust ? n.gust+' m/s' : '');
    add('進行', [n.course, n.speed].filter(Boolean).join(' '));
    add('中心位置', `北緯${n.lat.toFixed(1)}° 東経${n.lon.toFixed(1)}°`);
    add('暴風域', n.stormKm ? '半径 '+n.stormKm+' km' : '');
    add('強風域', n.galeKm  ? '半径 '+n.galeKm +' km' : '');
    const f24 = ty.track.find(p => p.hours === 24);
    if (f24) add('24時間後', [f24.location, f24.pressure ? f24.pressure+'hPa' : ''].filter(Boolean).join(' / '));
    $('tyBody').innerHTML = rows.join('');

    $('src').textContent = '気象庁';
    $('stamp').textContent = fmtStamp(ty.issue, '発表 ');
    setEdgeBar(false);
    renderDots();
  });
}


function renderWeather(){
  SCENE = 'weather';
  fade(() => {
    showCard('weather');
    const W = CONFIG.weather, f = WFRAMES[wIdx];
    if (f){
      const d = f.vt;
      const wd = ['日','月','火','水','木','金','土'][d.getDay()];
      $('wxWhen').textContent = `${d.getHours()}時の天気`;
      $('wxDate').textContent = `${d.getMonth()+1}月${d.getDate()}日(${wd}) ${String(d.getHours()).padStart(2,'0')}:00 の予想`;
      $('stamp').textContent = fmtStamp(parseJST(f.basetime), '発表 ');
    } else {
      $('wxWhen').textContent = '取得できません';
      $('wxDate').textContent = '';
      $('stamp').textContent = '';
    }
    $('wxElem').textContent = ELEM_JA[W.element] || '天気';
    $('wxLegend').innerHTML = W.legend.map(([label, col]) =>
      `<div class="row"><span class="sw" style="background:${col}"></span>${label}</div>`).join('');
    $('src').textContent = '気象庁';
    setEdgeBar(false);
    renderDots();
  });
}

const ELEM_JA = { wm:'天気', temp:'気温', r3:'3時間降水量', s3:'3時間降雪量',
                  tmax:'日中の最高気温', tmin:'朝の最低気温' };
function parseJST(t){
  const m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)/.exec(String(t||''));
  return m ? new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00+09:00`) : null;
}

function renderDots(){
  let n, i;
  if (SCENE === 'typhoon'){ n = TYPHOONS.length; i = tIdx; }
  else if (SCENE === 'weather'){ n = WFRAMES.length; i = wIdx; }
  else { n = Math.max(ITEMS.length, 1); i = cursor; }
  const sq = SCENE !== 'train' ? ' ty' : '';
  $('dots').innerHTML = Array.from({length:Math.max(n,1)}, (_,k) =>
    `<div class="dot${k===i?' on':''}${sq}"></div>`).join('');
}

/* ===================== シーケンサ ===================== */
function advance(){
  const hasTy = CONFIG.typhoon.enabled && TYPHOONS.length > 0;
  const hasWx = CONFIG.weather.enabled && WFRAMES.length > 0;
  const toTy = () => { tIdx = 0; renderTyphoon(); };
  const toWx = () => { wIdx = 0; renderWeather(); };
  const toTr = () => { cursor = 0; renderTrain(); };

  if (SCENE === 'train'){
    if (cursor + 1 < ITEMS.length){ cursor++; renderTrain(); return; }
    if (hasTy) return toTy();
    if (hasWx) return toWx();
    toTr();
  } else if (SCENE === 'typhoon'){
    if (tIdx + 1 < TYPHOONS.length){ tIdx++; renderTyphoon(); return; }
    if (hasWx) return toWx();
    toTr();
  } else {
    if (wIdx + 1 < WFRAMES.length){ wIdx++; renderWeather(); return; }
    toTr();
  }
}
function schedule(){
  clearTimeout(timer);
  const sec = SCENE==='typhoon' ? CONFIG.typhoon.showSec
            : SCENE==='weather' ? CONFIG.weather.showSec
            : CONFIG.rotateSec;
  timer = setTimeout(() => { advance(); schedule(); }, sec * 1000);
}

async function refreshTrain(){
  try {
    const items = demoMode ? demoItems() : await loadInfo();
    items.sort((a,b) => statusInfo(b.status).sev - statusInfo(a.status).sev
                     || String(b.time).localeCompare(String(a.time)));
    ITEMS = items;
    if (cursor >= ITEMS.length) cursor = 0;
    if (SCENE === 'train') renderTrain();
  } catch(e){ console.error(e); }
}
async function refreshWeather(){
  WFRAMES = await loadWeather();
  if (wIdx >= WFRAMES.length) wIdx = 0;
  if (SCENE === 'weather'){
    if (!WFRAMES.length){ cursor = 0; renderTrain(); }
    else renderWeather();
  }
}

async function refreshTyphoon(){
  const list = demoMode ? demoTyphoon() : await loadTyphoons();
  TYPHOONS = list;
  if (tIdx >= TYPHOONS.length) tIdx = 0;
  if (SCENE === 'weather'){
    t = whole;
  } else if (SCENE === 'typhoon'){
    if (!TYPHOONS.length){ cursor = 0; renderTrain(); }
    else renderTyphoon();
  }
}

/* ===================== トークン / ログイン ===================== */
const STORE_KEY = 'odpt-overlay-tokens';

function readStored(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null') || null; }
  catch(e){ return null; }
}
function writeStored(t){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(t)); } catch(e){ /* file:// 等では無視 */ }
}
function clearStored(){
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
}
function applyTokens(t){
  if (t.key)  CONFIG.sources[0].key = t.key;
  if (t.ckey) CONFIG.sources[1].key = t.ckey;
}
function currentTokens(){
  return {
    key:  keyOk(CONFIG.sources[0]) ? CONFIG.sources[0].key  : '',
    ckey: keyOk(CONFIG.sources[1]) ? CONFIG.sources[1].key : '',
  };
}

function showLogin(){
  const t = currentTokens();
  $('lgKey').value  = t.key;
  $('lgCKey').value = t.ckey;
  $('login').classList.remove('hide');
  setTimeout(() => $('lgKey').focus(), 50);
}
function hideLogin(){ $('login').classList.add('hide'); }

function bindLogin(){
  $('lgStart').onclick = () => {
    const t = { key: $('lgKey').value.trim(), ckey: $('lgCKey').value.trim() };
    if ($('lgSave').checked) writeStored(t); else clearStored();
    applyTokens(t);
    hideLogin();
    boot(false);
  };
  $('lgDemo').onclick = () => { hideLogin(); boot(true); };
  $('login').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('lgStart').click();
    if (e.key === 'Escape') $('lgDemo').click();
  });
  addEventListener('keydown', e => {
    if ((e.key === 'k' || e.key === 'K') && $('login').classList.contains('hide')) showLogin();
  });
}

/* ===================== 起動 ===================== */
let booted = false;
async function boot(forceDemo){
  demoMode = !!forceDemo || !CONFIG.sources.some(keyOk);
  RAILWAYS.clear(); STATIONS.clear(); RAIL_TITLE.clear();
  if (demoMode) demoGeometry(); else await loadGeometry();
  cursor = 0; tIdx = 0; wIdx = 0; SCENE = 'train';
  await refreshTrain();
  await refreshTyphoon();
  await refreshWeather();
  if (!booted){
    booted = true;
    tick();
    setInterval(refreshTrain,   CONFIG.refreshSec * 1000);
    setInterval(refreshTyphoon, CONFIG.typhoon.refreshMin * 60 * 1000);
    setInterval(refreshWeather, CONFIG.weather.refreshMin * 60 * 1000);
  }
  schedule();
}

(function main(){
  document.documentElement.classList.toggle('map-dark', CONFIG.map.theme === 'dark');
  buildBaseMap();
  layout();
  bindLogin();

  const q = new URLSearchParams(location.search);
  const urlT = { key: q.get('key') || '', ckey: q.get('ckey') || '' };
  if (urlT.key || urlT.ckey) applyTokens(urlT);
  else { const s = readStored(); if (s) applyTokens(s); }

  if (q.has('demo')){ boot(true); return; }
  if (CONFIG.sources.some(keyOk)){ boot(false); return; }
  showLogin();
})();
</script>
